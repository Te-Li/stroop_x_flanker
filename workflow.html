<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固定实验流程｜认知实验平台</title>
  <style>
    :root{--bg:#eef2f7;--panel:#fff;--ink:#18212f;--muted:#667085;--line:#dce3ec;--brand:#3157d5;--brand-dark:#2445b4;--good:#087a55;--warn:#9a6700;--bad:#b42318;--shadow:0 18px 55px rgba(20,36,66,.12)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 8%,rgba(49,87,213,.11),transparent 32rem),var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:26px 0 46px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#3157d5,#7552b8)}.top-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.home,.reset-flow{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}.home{color:var(--muted);text-decoration:none}.reset-flow{color:var(--bad)}.reset-flow:disabled{cursor:wait;opacity:.55}.panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}.head{padding:28px 32px}.head-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{color:var(--brand);font-size:12px;font-weight:900;letter-spacing:.12em}.head h1{margin:6px 0 5px;font-size:34px}.meta{color:var(--muted);font-size:14px}.progress-text{font-size:13px;color:var(--muted);text-align:right}.progress{height:8px;margin-top:18px;border-radius:99px;background:#e8edf4;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#3157d5,#7552b8)}.layout{display:grid;grid-template-columns:390px 1fr;gap:18px;margin-top:18px}.timeline{padding:20px;max-height:720px;overflow:auto}.condition-title{margin:10px 5px 8px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.08em}.step{display:grid;width:100%;grid-template-columns:28px 1fr;gap:10px;padding:10px;border:0;border-radius:11px;color:inherit;background:transparent;text-align:left}.step[data-redo]:hover{background:#f3f5f8}.step.current,.step.redoing{background:#edf1ff}.step.done{color:#7b8494}.step-num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:#536177;background:#eef2f6;font-size:11px;font-weight:900}.step.done .step-num{color:#fff;background:var(--good)}.step.current .step-num,.step.redoing .step-num{color:#fff;background:var(--brand)}.step b{display:block;font-size:13px}.step small{color:var(--muted)}.current-panel{min-height:500px;padding:42px;display:flex;flex-direction:column;justify-content:center}.tag{align-self:flex-start;padding:5px 10px;border-radius:999px;color:var(--brand);background:#edf1ff;font-size:12px;font-weight:900}.current-panel h2{margin:16px 0 8px;font-size:clamp(30px,4vw,46px);line-height:1.15}.description{max-width:650px;color:var(--muted);font-size:16px}.condition-code{margin:20px 0;padding:18px;border:1px solid #d9d2eb;border-radius:15px;background:#f8f5fd}.condition-code span{display:block;color:var(--muted);font-size:12px}.condition-code strong{font-size:28px;color:#6844aa}.notice{margin-top:16px;padding:13px 15px;border-radius:12px;color:#5a6375;background:#f2f5f8;font-size:13px}.countdown{display:flex;align-items:baseline;justify-content:space-between;width:min(100%,420px);margin-top:18px;padding:18px 20px;border-radius:15px;color:#fff;background:#18212f}.countdown strong{font:800 40px Consolas,monospace;font-variant-numeric:tabular-nums}.breath-pacer{display:grid;place-items:center;width:min(100%,420px);min-height:260px;margin-top:18px;border-radius:20px;background:linear-gradient(160deg,#edf8f5,#eef1ff);overflow:hidden}.breath-orb{display:grid;place-items:center;width:170px;height:170px;border-radius:50%;color:#fff;background:linear-gradient(145deg,#37a98b,#5274dd);box-shadow:0 20px 50px rgba(49,87,213,.24);transform:scale(.55)}.breath-orb.running{animation:breathe 7.5s ease-in-out infinite}.breath-orb strong{font-size:22px}.breath-status{display:flex;justify-content:space-between;width:min(100%,420px);margin-top:10px;color:var(--muted);font-size:13px}.breath-actions,.test-actions{display:flex;gap:10px;width:min(100%,420px)}.breath-actions .primary,.breath-actions .secondary,.test-actions .primary,.test-actions .secondary{flex:1}.breath-actions .secondary,.test-actions .secondary{margin-top:24px}.breath-actions .secondary:disabled{cursor:not-allowed;opacity:.5}@keyframes breathe{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}.primary,.secondary{min-height:50px;padding:0 22px;border:0;border-radius:12px;font-weight:900}.primary{margin-top:24px;color:#fff;background:var(--brand);box-shadow:0 9px 22px rgba(49,87,213,.23)}.primary:hover{background:var(--brand-dark)}.primary:disabled{cursor:wait;opacity:.62}.secondary{color:var(--brand);background:#edf1ff}.field{margin-top:20px}.field label{display:block;margin-bottom:7px;font-weight:800}.field input,.field textarea{width:min(100%,420px);padding:0 14px;border:1px solid #cdd7e4;border-radius:12px;outline:none}.field input{height:50px}.field textarea{min-height:76px;padding-top:11px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,87,213,.12)}.error{min-height:22px;margin-top:9px;color:var(--bad);font-size:13px}.complete{text-align:center;align-items:center}.complete-icon{display:grid;place-items:center;width:76px;height:76px;border-radius:24px;color:#fff;background:var(--good);font-size:36px;font-weight:900}.complete .primary{width:min(100%,360px)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.timeline{max-height:330px}.current-panel{min-height:440px}.head-row{align-items:flex-start;flex-direction:column}.progress-text{text-align:left}}
    @media(max-width:500px){.app{width:calc(100% - 16px);padding-top:12px}.head,.current-panel{padding:25px 20px}.timeline{padding:14px}.topbar .home{font-size:12px}}
  </style>
</head>
<body><main class="app"><header class="topbar"><div class="brand"><div class="mark">程</div><span>固定实验流程</span></div><div class="top-actions"><button class="reset-flow" id="resetFlow" type="button">清空并重置流程</button><a class="home" href="index.html">← 返回实验平台</a></div></header>
    <section class="panel head"><div class="head-row"><div><div class="eyebrow">ONE VISIT · TWO CONDITIONS</div><h1>单次到访实验</h1><div class="meta" id="sessionMeta">正在读取流程…</div></div><div class="progress-text" id="progressText"></div></div><div class="progress"><span id="progressBar"></span></div></section>
    <div class="layout"><aside class="panel timeline" id="timeline"></aside><section class="panel current-panel" id="currentPanel"></section></div>
  </main><script src="app-storage.js"></script><script>
  'use strict';
  const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),sessionId=query.get('session')||'';
  let session=null,busy=false,redoIndex=-1,manualTimer=null,breathTimer=null,spaceTimer=null,manualStartedAt='',manualDeadlineMs=0;
  const CONDITION_STEPS=[
    {base:'physPre',kind:'manual',title:'2分钟生理指标测量',description:'点击开始后计时，结束后自动进入下一步。',duration:2,manualType:'physiology',item:'PHY-C{C}-1'},
    {base:'pvt1',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成3分钟PVT-B。',item:'PVT-C{C}-1'},
    {base:'q1',kind:'questionnaire',title:'主观疲劳问卷',description:'完成本次问卷。',item:'Q-C{C}-1'},
    {base:'mix',kind:'mixed',title:'Stroop–Flanker混合测试',description:'完成混合任务。',item:'MIX-C{C}'},
    {base:'pvt2',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成本次PVT-B。',item:'PVT-C{C}-2'},
    {base:'q2',kind:'questionnaire',title:'主观疲劳问卷',description:'完成本次问卷。',item:'Q-C{C}-2'},
    {base:'physMid',kind:'manual',title:'2分钟生理指标测量',description:'点击开始后计时，结束后自动进入下一步。',duration:2,manualType:'physiology',item:'PHY-C{C}-2'},
    {base:'space',kind:'manual',title:'3分钟空间交互',description:'完成后手动点击继续。',duration:3,manualType:'space_interaction',item:'SPACE-C{C}'},
    {base:'pvt3',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成本次PVT-B。',item:'PVT-C{C}-3'},
    {base:'physPost',kind:'manual',title:'5分钟生理指标测量',description:'点击开始后计时，结束后自动进入下一步。',duration:5,manualType:'physiology',item:'PHY-C{C}-3'},
    {base:'q3',kind:'questionnaire',title:'主观疲劳问卷',description:'完成本次问卷。',item:'Q-C{C}-3'}
  ];
  function conditionSteps(order){return CONDITION_STEPS.map(step=>({...step,id:`C${order}_${step.base}`,conditionOrder:order,itemId:step.item.replace('{C}',order)}))}
  const BREATH_STEP={id:'BREATH_CAL',kind:'breathing',title:'呼吸节律校准',description:'跟随圆圈呼吸，吸气时扩大，呼气时缩小。',itemId:'BREATH-CAL',manualType:'breathing_calibration',breathRate:8,minDuration:2,defaultNotes:'观察呼吸曲线规律波动，等待自动计算的呼吸次数接近8次/min，节律呼吸至少两分钟'};
  const STEPS=[BREATH_STEP,...conditionSteps(1),{id:'INTERMISSION',kind:'break',title:'中场休息与条件切换',description:'输入下一个实验条件代码。'},...conditionSteps(2),{id:'FINAL_PHYS',kind:'manual',title:'2分钟收尾生理信号测量',description:'点击开始后计时，结束后自动进入下一步。',duration:2,manualType:'physiology',conditionOrder:2,itemId:'PHY-END'}];
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function conditionCode(step){return session.conditionCodes?.[step.conditionOrder-1]||''}
  async function load(){if(!sessionId){showError('缺少到访流程编号，请从实验平台重新开始。');return}session=await ExperimentStore.getSession(sessionId);if(!session){showError('未找到该到访流程。');return}if(session.workflowVersion!==2){const completed=[...(session.completedSteps||[])];if(!completed.some(item=>item.stepId===BREATH_STEP.id)){completed.unshift({stepId:BREATH_STEP.id,runId:'',completedAt:new Date().toISOString(),migrated:true});session.currentStepIndex=Math.min((Number(session.currentStepIndex)||0)+1,STEPS.length)}session.completedSteps=completed;session.workflowVersion=2;session=await ExperimentStore.saveSession(session)}const redoValue=query.get('redo'),requested=redoValue===null?-1:Number(redoValue);if(Number.isInteger(requested)&&requested>=0&&requested<STEPS.length&&STEPS[requested].kind!=='break')redoIndex=requested;if((session.currentStepIndex||0)>=STEPS.length&&session.status!=='complete'){session.status='complete';session.completedAt=new Date().toISOString();session=await ExperimentStore.saveSession(session)}const index=redoIndex>=0?redoIndex:session.currentStepIndex||0;if(redoIndex<0&&index<STEPS.length){const step=STEPS[index];if(session.currentStepStartedFor!==step.id){session.currentStepStartedFor=step.id;session.currentStepStartedAt=new Date().toISOString();session=await ExperimentStore.saveSession(session)}}render()}
  function render(){const progress=Math.min(session.currentStepIndex||0,STEPS.length),display=redoIndex>=0?redoIndex:progress,percent=progress/STEPS.length*100;$('sessionMeta').textContent=`被试 ${session.participantId} · 到访 ${new Date(session.startedAt).toLocaleString('zh-CN')}`;$('progressText').textContent=`已完成 ${progress} / ${STEPS.length} 个步骤`;$('progressBar').style.width=`${percent}%`;$('timeline').innerHTML=timelineHtml(progress,display);bindTimeline();if(progress>=STEPS.length&&redoIndex<0){$('currentPanel').className='panel current-panel complete';$('currentPanel').innerHTML='<div class="complete-icon">✓</div><h2>整场实验已完成</h2><p class="description">点击左侧已完成项目可重新测量。</p><button class="primary" id="backHome">返回实验平台</button>';$('backHome').onclick=()=>location.href='index.html';return}const step=STEPS[display];$('currentPanel').className='panel current-panel';$('currentPanel').innerHTML=currentHtml(step,display);bindCurrent(step)}
  function timelineHtml(progress,display){let lastOrder=0;return STEPS.map((step,index)=>{let heading='';if(step.conditionOrder&&step.conditionOrder!==lastOrder){lastOrder=step.conditionOrder;heading=`<div class="condition-title">实验条件 ${lastOrder} · ${esc(conditionCode(step)||'待输入')}</div>`}if(step.kind==='break')heading='<div class="condition-title">条件切换</div>';const done=index<progress,canRedo=done&&step.kind!=='break',state=redoIndex===index?'redoing':index===progress?'current':done?'done':'';return `${heading}<button type="button" class="step ${state}" ${canRedo?`data-redo="${index}" title="重新测量此项目"`:''}><span class="step-num">${done?'✓':index+1}</span><span><b>${esc(step.title)}</b><small>${esc(`${step.itemId||''}${step.duration?`${step.itemId?' · ':''}${step.duration}分钟`:''}`)}</small></span></button>`}).join('')}
  function bindTimeline(){$('timeline').querySelectorAll('[data-redo]').forEach(button=>button.addEventListener('click',()=>location.href=`workflow.html?session=${encodeURIComponent(sessionId)}&redo=${button.dataset.redo}`))}
  function currentHtml(step,index){const tag=redoIndex>=0?'重新测量':step.kind==='breathing'?'呼吸校准':step.kind==='manual'?'确认步骤':step.kind==='break'?'中场休息':step.kind==='pvtb'?'PVT-B':step.kind==='questionnaire'?'主观问卷':'混合任务';const code=step.conditionOrder?`<div class="condition-code"><span>当前实验条件代码</span><strong>${esc(conditionCode(step))}</strong></div>`:'';if(step.kind==='break')return `<div class="tag">${tag}</div><h2>${step.title}</h2><p class="description">${step.description}</p><div class="field"><label for="nextCode">第二个实验条件代码</label><input id="nextCode" maxlength="50" autocomplete="off" placeholder="请输入 S 或 C"><div class="meta">静坐：S　·　组合地形：C</div></div><div class="error" id="stepError"></div><button class="primary" id="continueButton">开始第二个实验条件</button>`;const fields=`<div class="field"><label for="stepItemId">记录名称</label><input id="stepItemId" maxlength="80" autocomplete="off" value="${esc(step.itemId)}"></div><div class="field"><label for="stepNotes">项目备注</label><textarea id="stepNotes" maxlength="500" placeholder="特殊情况（可选）">${esc(step.defaultNotes||'')}</textarea></div>`;if(step.kind==='breathing')return `<div class="tag">步骤 ${index+1} / ${STEPS.length} · ${tag}</div><h2>${esc(step.title)}</h2><p class="description">${esc(step.description)}</p>${fields}<div class="breath-pacer"><div class="breath-orb" id="breathOrb"><strong id="breathPhase">准备</strong></div></div><div class="breath-status"><span>8次/分钟 · 至少2分钟</span><span>已进行 <b id="breathElapsed">00:00</b></span></div><div class="error" id="stepError"></div><div class="breath-actions"><button class="primary" id="continueButton">开始校准</button><button class="secondary" id="endBreathing" disabled>结束并保存</button></div>`;if(step.manualType==='space_interaction'){const running=redoIndex<0&&Boolean(session.stepTimers?.[step.id]?.startedAt);return `<div class="tag">步骤 ${index+1} / ${STEPS.length} · ${tag}</div><h2>${esc(step.title)}</h2><p class="description">${esc(step.description)}</p>${code}${fields}<div class="notice">计划时长：${step.duration}分钟</div><div class="countdown"><span>已进行</span><strong id="manualClock">00:00</strong></div><div class="error" id="stepError"></div><div class="breath-actions"><button class="primary" id="continueButton" ${running?'disabled':''}>${running?'交互进行中':'开始交互'}</button><button class="secondary" id="endSpace" ${running?'':'disabled'}>结束并保存</button></div>`}const physiology=step.manualType==='physiology',running=physiology&&redoIndex<0&&Boolean(session.stepTimers?.[step.id]?.deadlineMs),action=physiology?(running?'计时中…':'开始计时'):step.kind==='manual'?'完成并继续':'进入正式测试',firstPvt=step.id==='C1_pvt1',actions=firstPvt?`<div class="test-actions"><button class="secondary" id="practiceButton">先练习</button><button class="primary" id="continueButton">${action}</button></div>`:`<button class="primary" id="continueButton" ${running?'disabled':''}>${action}</button>`;return `<div class="tag">步骤 ${index+1} / ${STEPS.length} · ${tag}</div><h2>${esc(step.title)}</h2><p class="description">${esc(step.description)}</p>${code}${fields}${physiology?`<div class="countdown"><span>剩余时间</span><strong id="manualClock">${formatClock(step.duration*60000)}</strong></div>`:step.duration?`<div class="notice">计划时长：${step.duration}分钟</div>`:''}<div class="error" id="stepError"></div>${actions}`}
  function bindCurrent(step){if(step.kind==='breathing'){prepareBreathing(step);return}if(step.manualType==='physiology'){const timing=redoIndex<0?session.stepTimers?.[step.id]:null;if(timing?.deadlineMs)startPhysiology(step,timing).catch(showStepError);else $('continueButton').addEventListener('click',()=>startPhysiology(step).catch(showStepError),{once:true});return}if(step.manualType==='space_interaction'){prepareSpace(step);return}if(step.id==='C1_pvt1')$('practiceButton').addEventListener('click',launchPvtPractice);$('continueButton').addEventListener('click',async()=>{if(busy)return;busy=true;$('continueButton').disabled=true;try{if(step.kind==='break')await finishBreak(step);else launchTest(step)}catch(error){showStepError(error)}})}
  async function finishBreak(step){const code=$('nextCode').value.trim();if(!code)throw new Error('请输入第二个实验条件代码。');session.conditionCodes[1]=code;session=await ExperimentStore.saveSession(session);await ExperimentStore.completeSessionStep(session.sessionId,step.id,'');location.reload()}
  function currentItemId(){const itemId=$('stepItemId').value.trim();if(!itemId)throw new Error('本项记录名称不能为空。');return itemId}
  function currentNotes(){return $('stepNotes')?.value.trim()||''}
  function formatClock(ms){const seconds=Math.max(0,Math.ceil(ms/1000));return`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  function formatElapsed(ms){const seconds=Math.max(0,Math.floor(ms/1000));return`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
  async function startPhysiology(step,existingTiming=null){const button=$('continueButton');button.disabled=true;button.textContent='计时中…';let timing=existingTiming;if(!timing){const now=Date.now();timing={startedAt:new Date(now).toISOString(),deadlineMs:now+step.duration*60000};if(redoIndex<0){session.stepTimers=session.stepTimers||{};session.stepTimers[step.id]=timing;session=await ExperimentStore.saveSession(session)}}manualStartedAt=timing.startedAt;manualDeadlineMs=timing.deadlineMs;const tick=()=>{const left=Math.max(0,timing.deadlineMs-Date.now());$('manualClock').textContent=formatClock(left);if(left<=0){clearInterval(manualTimer);completePhysiology(step)}};tick();if(!busy)manualTimer=setInterval(tick,200)}
  function prepareBreathing(step){$('endBreathing').addEventListener('click',()=>finishBreathing(step));const timing=redoIndex<0?session.stepTimers?.[step.id]:null;if(timing?.startedAt)beginBreathing(step,timing).catch(showStepError);else $('continueButton').addEventListener('click',()=>beginBreathing(step).catch(showStepError),{once:true})}
  async function beginBreathing(step,existingTiming=null){const button=$('continueButton');button.disabled=true;button.textContent='校准进行中';let timing=existingTiming;if(!timing){const now=Date.now();timing={startedAt:new Date(now).toISOString()};if(redoIndex<0){session.stepTimers=session.stepTimers||{};session.stepTimers[step.id]=timing;session=await ExperimentStore.saveSession(session)}}manualStartedAt=timing.startedAt;const cycleMs=60000/step.breathRate,initialElapsed=Math.max(0,Date.now()-Date.parse(timing.startedAt)),orb=$('breathOrb');orb.style.animationDelay=`-${initialElapsed%cycleMs}ms`;orb.classList.add('running');const tick=()=>{const elapsed=Math.max(0,Date.now()-Date.parse(timing.startedAt)),phase=elapsed%cycleMs<cycleMs/2?'吸气':'呼气';$('breathPhase').textContent=phase;$('breathElapsed').textContent=formatElapsed(elapsed);$('endBreathing').disabled=elapsed<step.minDuration*60000};tick();breathTimer=setInterval(tick,100)}
  async function finishBreathing(step){if(busy||$('endBreathing').disabled)return;busy=true;clearInterval(breathTimer);$('endBreathing').disabled=true;$('breathOrb').classList.remove('running');try{await finishManual(step)}catch(error){showStepError(error);$('endBreathing').disabled=false}}
  function prepareSpace(step){$('endSpace').addEventListener('click',()=>finishSpace(step));const timing=redoIndex<0?session.stepTimers?.[step.id]:null;if(timing?.startedAt)beginSpace(step,timing).catch(showStepError);else $('continueButton').addEventListener('click',()=>beginSpace(step).catch(showStepError),{once:true})}
  async function beginSpace(step,existingTiming=null){const button=$('continueButton');button.disabled=true;button.textContent='交互进行中';let timing=existingTiming;if(!timing){const now=Date.now();timing={startedAt:new Date(now).toISOString()};if(redoIndex<0){session.stepTimers=session.stepTimers||{};session.stepTimers[step.id]=timing;session=await ExperimentStore.saveSession(session)}}manualStartedAt=timing.startedAt;$('endSpace').disabled=false;const tick=()=>$('manualClock').textContent=formatElapsed(Math.max(0,Date.now()-Date.parse(timing.startedAt)));tick();spaceTimer=setInterval(tick,200)}
  async function finishSpace(step){if(busy||$('endSpace').disabled)return;busy=true;clearInterval(spaceTimer);$('endSpace').disabled=true;try{await finishManual(step)}catch(error){showStepError(error);$('endSpace').disabled=false}}
  async function completePhysiology(step){if(busy)return;busy=true;try{await finishManual(step)}catch(error){showStepError(error);const button=$('continueButton');button.textContent='重试保存';button.addEventListener('click',()=>completePhysiology(step),{once:true})}}
  function showStepError(error){$('stepError').textContent=error.message;busy=false;const button=$('continueButton');if(button)button.disabled=false}
  async function finishManual(step){const completedAt=step.manualType==='physiology'&&manualDeadlineMs?new Date(manualDeadlineMs).toISOString():new Date().toISOString(),itemId=currentItemId(),startedAt=manualStartedAt||session.currentStepStartedAt||completedAt,actualDurationSeconds=Math.max(0,(Date.parse(completedAt)-Date.parse(startedAt))/1000),status=step.manualType==='physiology'?'timer_completed':step.manualType==='breathing_calibration'?'breathing_calibrated':'manually_completed';let run={testType:'manual',participantId:session.participantId,testItemId:itemId,runNotes:currentNotes(),conditionCode:conditionCode(step),conditionOrder:step.conditionOrder,sessionId:session.sessionId,workflowStepId:step.id,manualType:step.manualType,plannedDurationMinutes:step.duration??'',minimumDurationMinutes:step.minDuration??'',breathRatePerMinute:step.breathRate??'',actualDurationSeconds,startedAt,completedAt,aborted:false,summary:{status,actualDurationSeconds}};run=await ExperimentStore.saveRun(run);ExperimentStore.downloadRunCsv(run);if(redoIndex<0)await ExperimentStore.completeSessionStep(session.sessionId,step.id,run.runId);location.href=`workflow.html?session=${encodeURIComponent(session.sessionId)}`}
  function launchTest(step){const params=new URLSearchParams({participant:session.participantId,item:currentItemId(),notes:currentNotes(),workflow:'1',session:session.sessionId,step:step.id,condition:conditionCode(step),order:String(step.conditionOrder),redo:redoIndex>=0?'1':'0'});location.href=`${step.kind}.html?${params}`}
  function launchPvtPractice(){const params=new URLSearchParams({practice:'1',returnSession:session.sessionId});if(redoIndex>=0)params.set('returnRedo',String(redoIndex));location.href=`pvtb.html?${params}`}
  function showError(message){$('sessionMeta').textContent=message;$('timeline').innerHTML='';$('currentPanel').innerHTML=`<h2>无法载入流程</h2><p class="description">${esc(message)}</p><button class="primary" id="backHome">返回实验平台</button>`;$('backHome').onclick=()=>location.href='index.html'}
  $('resetFlow').addEventListener('click',async()=>{if(!session)return;if(!confirm('清空当前流程进度并返回首页？已保存的实验结果不会删除。'))return;const button=$('resetFlow');button.disabled=true;try{await ExperimentStore.deleteSession(session.sessionId);location.href='index.html'}catch(error){button.disabled=false;alert(`重置失败：${error.message}`)}});
  load().catch(error=>showError(error.message));
  </script></body></html>
