<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>固定实验流程｜认知实验平台</title>
  <style>
    :root{--bg:#eef2f7;--panel:#fff;--ink:#18212f;--muted:#667085;--line:#dce3ec;--brand:#3157d5;--brand-dark:#2445b4;--good:#087a55;--warn:#9a6700;--bad:#b42318;--shadow:0 18px 55px rgba(20,36,66,.12)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 8%,rgba(49,87,213,.11),transparent 32rem),var(--bg);font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.55}button,input{font:inherit}button{cursor:pointer}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:26px 0 46px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#3157d5,#7552b8)}.home{padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff;text-decoration:none;font-size:13px}.panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}.head{padding:28px 32px}.head-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.eyebrow{color:var(--brand);font-size:12px;font-weight:900;letter-spacing:.12em}.head h1{margin:6px 0 5px;font-size:34px}.meta{color:var(--muted);font-size:14px}.progress-text{font-size:13px;color:var(--muted);text-align:right}.progress{height:8px;margin-top:18px;border-radius:99px;background:#e8edf4;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#3157d5,#7552b8)}.layout{display:grid;grid-template-columns:390px 1fr;gap:18px;margin-top:18px}.timeline{padding:20px;max-height:720px;overflow:auto}.condition-title{margin:10px 5px 8px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.08em}.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px;border-radius:11px}.step.current{background:#edf1ff}.step.done{color:#7b8494}.step-num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:#536177;background:#eef2f6;font-size:11px;font-weight:900}.step.done .step-num{color:#fff;background:var(--good)}.step.current .step-num{color:#fff;background:var(--brand)}.step b{display:block;font-size:13px}.step small{color:var(--muted)}.current-panel{min-height:500px;padding:42px;display:flex;flex-direction:column;justify-content:center}.tag{align-self:flex-start;padding:5px 10px;border-radius:999px;color:var(--brand);background:#edf1ff;font-size:12px;font-weight:900}.current-panel h2{margin:16px 0 8px;font-size:clamp(30px,4vw,46px);line-height:1.15}.description{max-width:650px;color:var(--muted);font-size:16px}.condition-code{margin:20px 0;padding:18px;border:1px solid #d9d2eb;border-radius:15px;background:#f8f5fd}.condition-code span{display:block;color:var(--muted);font-size:12px}.condition-code strong{font-size:28px;color:#6844aa}.notice{margin-top:16px;padding:13px 15px;border-radius:12px;color:#5a6375;background:#f2f5f8;font-size:13px}.primary,.secondary{min-height:50px;padding:0 22px;border:0;border-radius:12px;font-weight:900}.primary{margin-top:24px;color:#fff;background:var(--brand);box-shadow:0 9px 22px rgba(49,87,213,.23)}.primary:hover{background:var(--brand-dark)}.secondary{color:var(--brand);background:#edf1ff}.field{margin-top:20px}.field label{display:block;margin-bottom:7px;font-weight:800}.field input{width:min(100%,420px);height:50px;padding:0 14px;border:1px solid #cdd7e4;border-radius:12px;outline:none}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,87,213,.12)}.error{min-height:22px;margin-top:9px;color:var(--bad);font-size:13px}.complete{text-align:center;align-items:center}.complete-icon{display:grid;place-items:center;width:76px;height:76px;border-radius:24px;color:#fff;background:var(--good);font-size:36px;font-weight:900}.complete .primary{width:min(100%,360px)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.timeline{max-height:330px}.current-panel{min-height:440px}.head-row{align-items:flex-start;flex-direction:column}.progress-text{text-align:left}}
    @media(max-width:500px){.app{width:calc(100% - 16px);padding-top:12px}.head,.current-panel{padding:25px 20px}.timeline{padding:14px}.topbar .home{font-size:12px}}
  </style>
</head>
<body><main class="app"><header class="topbar"><div class="brand"><div class="mark">程</div><span>固定实验流程</span></div><a class="home" href="index.html">← 返回实验平台</a></header>
    <section class="panel head"><div class="head-row"><div><div class="eyebrow">ONE VISIT · TWO CONDITIONS</div><h1>单次到访实验</h1><div class="meta" id="sessionMeta">正在读取流程…</div></div><div class="progress-text" id="progressText"></div></div><div class="progress"><span id="progressBar"></span></div></section>
    <div class="layout"><aside class="panel timeline" id="timeline"></aside><section class="panel current-panel" id="currentPanel"></section></div>
  </main><script src="app-storage.js"></script><script>
  'use strict';
  const $=id=>document.getElementById(id),query=new URLSearchParams(location.search),sessionId=query.get('session')||'';let session=null,busy=false;
  const CONDITION_STEPS=[
    {base:'physPre',kind:'manual',title:'2分钟生理指标测量',description:'请在本机生理信号采集软件中完成2分钟测量，确认采集结束后点击完成。',duration:2,manualType:'physiology'},
    {base:'pvt1',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成3分钟PVT-B。',itemBase:'PVT',slot:1},
    {base:'q1',kind:'questionnaire',title:'主观疲劳问卷',description:'完成VAS与POMS疲劳问卷。',itemBase:'Q',slot:1},
    {base:'mix',kind:'mixed',title:'Stroop–Flanker混合测试',description:'按固定参数完成混合认知任务。',itemBase:'MIX',slot:1},
    {base:'pvt2',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成本条件内第2次PVT-B。',itemBase:'PVT',slot:2},
    {base:'q2',kind:'questionnaire',title:'主观疲劳问卷',description:'完成本条件内第2次主观问卷。',itemBase:'Q',slot:2},
    {base:'physMid',kind:'manual',title:'2分钟生理指标测量',description:'请完成空间交互前的2分钟生理信号测量。',duration:2,manualType:'physiology'},
    {base:'space',kind:'manual',title:'3分钟空间交互',description:'请按照当前实验条件完成3分钟空间交互，结束后由实验员确认。',duration:3,manualType:'space_interaction'},
    {base:'pvt3',kind:'pvtb',title:'PVT-B警觉性测试',description:'完成本条件内第3次PVT-B。',itemBase:'PVT',slot:3},
    {base:'physPost',kind:'manual',title:'5分钟生理指标测量',description:'请完成空间交互后的5分钟生理信号测量。',duration:5,manualType:'physiology'},
    {base:'q3',kind:'questionnaire',title:'主观疲劳问卷',description:'完成本条件内第3次主观问卷。',itemBase:'Q',slot:3}
  ];
  function conditionSteps(order){const prefix=order===1?0:1;return CONDITION_STEPS.map((step,index)=>({...step,id:`C${order}_${step.base}`,conditionOrder:order,itemId:step.itemBase?`${step.itemBase}${prefix}${step.slot}`:step.manualType==='space_interaction'?`SPACE-C${order}`:`PHY-C${order}-${String(index+1).padStart(2,'0')}`}))}
  const STEPS=[...conditionSteps(1),{id:'INTERMISSION',kind:'break',title:'中场休息与条件切换',description:'休息结束后输入第二个实验条件代码。'},...conditionSteps(2),{id:'FINAL_PHYS',kind:'manual',title:'2分钟收尾生理信号测量',description:'完成整场实验最后2分钟生理信号测量。',duration:2,manualType:'physiology',conditionOrder:2,itemId:'PHY-END'}];
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function conditionCode(step){return session.conditionCodes?.[step.conditionOrder-1]||''}
  async function load(){if(!sessionId){showError('缺少到访流程编号，请从实验平台重新开始。');return}session=await ExperimentStore.getSession(sessionId);if(!session){showError('未找到该到访流程。');return}if((session.currentStepIndex||0)>=STEPS.length){if(session.status!=='complete'){session.status='complete';session.completedAt=new Date().toISOString();session=await ExperimentStore.saveSession(session)}render();return}const step=STEPS[session.currentStepIndex||0];if(session.currentStepStartedFor!==step.id){session.currentStepStartedFor=step.id;session.currentStepStartedAt=new Date().toISOString();session=await ExperimentStore.saveSession(session)}render()}
  function render(){const index=Math.min(session.currentStepIndex||0,STEPS.length),percent=index/STEPS.length*100;$('sessionMeta').textContent=`被试 ${session.participantId} · 到访 ${new Date(session.startedAt).toLocaleString('zh-CN')}`;$('progressText').textContent=`已完成 ${index} / ${STEPS.length} 个步骤`;$('progressBar').style.width=`${percent}%`;$('timeline').innerHTML=timelineHtml(index);if(index>=STEPS.length){$('currentPanel').className='panel current-panel complete';$('currentPanel').innerHTML='<div class="complete-icon">✓</div><h2>整场实验已完成</h2><p class="description">两种实验条件和收尾生理测量均已完成，所有网页测试结果已保存。</p><button class="primary" id="backHome">返回实验平台</button>';$('backHome').onclick=()=>location.href='index.html';return}const step=STEPS[index];$('currentPanel').className='panel current-panel';$('currentPanel').innerHTML=currentHtml(step,index);bindCurrent(step)}
  function timelineHtml(current){let lastOrder=0;return STEPS.map((step,index)=>{let heading='';if(step.conditionOrder&&step.conditionOrder!==lastOrder){lastOrder=step.conditionOrder;heading=`<div class="condition-title">实验条件 ${lastOrder} · ${esc(conditionCode(step)||'待输入')}</div>`}if(step.kind==='break')heading='<div class="condition-title">条件切换</div>';return `${heading}<div class="step ${index<current?'done':index===current?'current':''}"><div class="step-num">${index<current?'✓':index+1}</div><div><b>${esc(step.title)}</b><small>${esc(step.itemId||step.duration?`${step.itemId||''}${step.itemId&&step.duration?' · ':''}${step.duration?step.duration+'分钟':''}`:'')}</small></div></div>`}).join('')}
  function currentHtml(step,index){const tag=step.kind==='manual'?'实验员确认步骤':step.kind==='break'?'中场休息':step.kind==='pvtb'?'PVT-B':step.kind==='questionnaire'?'主观问卷':'混合任务';const code=step.conditionOrder?`<div class="condition-code"><span>当前实验条件代码</span><strong>${esc(conditionCode(step))}</strong></div>`:'';if(step.kind==='break')return `<div class="tag">${tag}</div><h2>${step.title}</h2><p class="description">${step.description}</p><div class="field"><label for="nextCode">第二个实验条件代码</label><input id="nextCode" maxlength="50" autocomplete="off" placeholder="请输入下一实验条件代码"></div><div class="error" id="stepError"></div><button class="primary" id="continueButton">开始第二个实验条件</button>`;const action=step.kind==='manual'?'确认已完成并继续':'进入本项测试';return `<div class="tag">步骤 ${index+1} / ${STEPS.length} · ${tag}</div><h2>${esc(step.title)}</h2><p class="description">${esc(step.description)}</p>${code}<div class="field"><label for="stepItemId">本项记录名称（可修改）</label><input id="stepItemId" maxlength="80" autocomplete="off" value="${esc(step.itemId)}" aria-describedby="itemNameHelp"><div class="meta" id="itemNameHelp">预设名称仅用于规范记录；调试时可在进入或完成本步骤前修改。</div></div>${step.duration?`<div class="notice">计划时长：${step.duration}分钟。网页不连接LSL，也不强制计时；请以本机采集或交互程序为准。</div>`:''}<div class="notice">完成后将自动保存本步骤记录；网页测试还会自动触发CSV下载。若浏览器询问，请允许本站下载多个文件。</div><div class="error" id="stepError"></div><button class="primary" id="continueButton">${action}</button>`}
  function bindCurrent(step){$('continueButton').addEventListener('click',async()=>{if(busy)return;busy=true;$('continueButton').disabled=true;try{if(step.kind==='break')await finishBreak(step);else if(step.kind==='manual')await finishManual(step);else launchTest(step)}catch(error){$('stepError').textContent=error.message;busy=false;$('continueButton').disabled=false}})}
  async function finishBreak(step){const code=$('nextCode').value.trim();if(!code)throw new Error('请输入第二个实验条件代码。');session.conditionCodes[1]=code;session=await ExperimentStore.saveSession(session);await ExperimentStore.completeSessionStep(session.sessionId,step.id,'');location.reload()}
  function currentItemId(){const itemId=$('stepItemId').value.trim();if(!itemId)throw new Error('本项记录名称不能为空。');return itemId}
  async function finishManual(step){const completedAt=new Date().toISOString(),itemId=currentItemId();let run={testType:'manual',participantId:session.participantId,testItemId:itemId,conditionCode:conditionCode(step),conditionOrder:step.conditionOrder,sessionId:session.sessionId,workflowStepId:step.id,manualType:step.manualType,plannedDurationMinutes:step.duration,startedAt:session.currentStepStartedAt||completedAt,completedAt,aborted:false,summary:{status:'manually_confirmed'}};run=await ExperimentStore.saveRun(run);ExperimentStore.downloadRunCsv(run);await ExperimentStore.completeSessionStep(session.sessionId,step.id,run.runId);location.reload()}
  function launchTest(step){const params=new URLSearchParams({participant:session.participantId,item:currentItemId(),workflow:'1',session:session.sessionId,step:step.id,condition:conditionCode(step),order:String(step.conditionOrder)});location.href=`${step.kind}.html?${params}`}
  function showError(message){$('sessionMeta').textContent=message;$('timeline').innerHTML='';$('currentPanel').innerHTML=`<h2>无法载入流程</h2><p class="description">${esc(message)}</p><button class="primary" id="backHome">返回实验平台</button>`;$('backHome').onclick=()=>location.href='index.html'}
  load().catch(error=>showError(error.message));
  </script></body></html>
